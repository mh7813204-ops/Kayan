<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kayan Car Wash</title>
<style>
:root{--bg:#000;--surface:#131313;--ink:#fff;--muted:#A9A9A9;--line:#2F2F2F;--water:#F28B2B;--sun:#F28B2B;--on-sun:#000;--sel:#2A1808;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
 *{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',Tahoma,Arial,sans-serif;line-height:1.7}
main{max-width:560px;margin:0 auto;padding:0 16px 40px}
header{padding:20px 0 18px;text-align:center}.logo{display:block;width:170px;height:auto;margin:0 auto 6px;border-radius:14px}.dur{display:block;font-weight:400;color:var(--muted);font-size:.85rem;margin-top:2px}
h1{margin:0;font-size:2rem;font-weight:800;line-height:1.2}
h1 span{color:var(--water)}
header p{margin:6px 0 0;color:var(--muted)}
section{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
h2{margin:0 0 10px;font-size:1.05rem;font-weight:600}
.opts{display:grid;gap:8px}
.opt{display:block;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;font-weight:600}
.opt input{margin-inline-end:8px;accent-color:var(--water)}
.opt:has(input:checked){border-color:var(--water);background:var(--sel)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:8px 12px;font:inherit;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--water);background:var(--sel)}
.chip:focus-visible,.opt:focus-within,button.go:focus-visible,input[type=text]:focus-visible,input[type=tel]:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
label.f{display:block;margin-bottom:10px;font-weight:600}
input[type=text],input[type=tel],textarea{resize:vertical;width:100%;margin-top:4px;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
button.go{width:100%;border:0;border-radius:12px;background:var(--sun);color:var(--on-sun);font:inherit;font-size:1.1rem;font-weight:800;padding:14px;cursor:pointer}
#err{color:#FF6B5A;font-weight:600;min-height:1.6em;margin:0 0 8px}
.done{display:none;border:2px solid var(--sun);border-radius:14px;padding:16px;margin-top:14px;text-align:center}.done b{display:block;font-size:2rem;color:var(--sun);direction:ltr;line-height:1.4}
.note{color:var(--muted);font-size:.9rem;text-align:center;margin-top:12px}
.btn{display:block;width:100%;text-align:center;text-decoration:none;border:0;border-radius:12px;background:var(--sun);color:var(--on-sun);font:inherit;font-weight:800;padding:12px;margin-top:12px}
.btn2{width:100%;margin-top:8px;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:12px;font:inherit;font-weight:600;padding:10px;cursor:pointer}
button.go[disabled]{opacity:.6}
.warn{margin-top:14px;text-align:right;border:1.5px solid var(--sun);border-radius:12px;padding:12px;background:var(--sel)}
.warn p{margin:0 0 6px;font-weight:800}
.warn ul{margin:0;padding-inline-start:20px}
.warn li{margin-bottom:4px}
.about{margin-top:16px;text-align:right;border-top:1px solid var(--line);padding-top:12px;color:var(--muted)}
.about h3{margin:0 0 6px;color:var(--ink);font-size:1rem}
.about p{margin:0}
.alertbox{margin:14px 0 0;padding:12px;border-radius:12px;background:var(--sun);color:var(--on-sun);font-weight:800;text-align:center}
</style>
</head>

<h1 dir="ltr">Kayan <span>Car Wash</span></h1>
<p>خد رقم دورك من موبايلك وماتستناش واقف. شغالين كل يوم من 12 الظهر لحد 12 بالليل.</p>
<p>مدة الغسيل من 30 إلى 45 دقيقة، ما عدا البريميوم والكيماوي.</p>
</header>

<div class="done" id="done" role="status"></div>

<div id="formArea">
<section><h2>اختار الخدمة</h2><div class="opts" id="services"></div></section>
<section><h2>طريقة الدفع</h2><div class="opts" id="pays"></div></section>
<section>
<h2>بياناتك</h2>
<label class="f">الاسم<input type="text" id="name" autocomplete="name"></label>
<label class="f">رقم الموبايل<input type="tel" id="phone" inputmode="tel" autocomplete="tel"></label>
<label class="f">نوع العربية<input type="text" id="car" placeholder="مثال: هيونداي النترا"></label>
<label class="f">رقم العربية (مطلوب)<input type="text" id="plate" placeholder="مثال: أ ب ج 1234"></label>
<label class="f">ملاحظات<textarea id="notes" rows="3" placeholder="أي حاجة تحب تقولهالنا"></textarea></label>
</section>
<p id="err" role="alert"></p>
<button class="go" id="send" type="button">خدلي رقم دور</button>
<p class="note">بعد ما تاخد رقمك، ابعت بياناتك على واتساب عشان نأكد.</p>
</div>
</main>

<script>
var API='https://script.google.com/macros/s/AKfycbxNmD9kkyMJviTFJvul_WZQ5pfGhuNkv4Vi82vdGEqeBobMtwLXZ1CMzxDf0oOMnwUpYA/exec';
var WA='201111959156';
var SERVICES=['غسيل داخلي وخارجي','غسيل بريميوم','غسيل خارجي','غسيل داخلي','غسيل كيماوي','غسيل داخلي وخارجي وشنطة','غسيل داخلي وخارجي وشنطة وماتور كيماوي','غسيل داخلي وخارجي وشنطة وماتور مياه وصابون','تلميع فوانيس','تلميع بولش'];
var service=null,pay=null;
var PAYS=['كاش','إنستا باي','فيزا'];
function el(t,c,txt){var e=document.createElement(t);if(c)e.className=c;if(txt)e.textContent=txt;return e}
function $(id){return document.getElementById(id)}
function newRid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
var rid=newRid(),sending=false;
function normPlate(v){
  v=String(v).replace(/[٠-٩]/g,function(c){return c.charCodeAt(0)-1632}).replace(/[۰-۹]/g,function(c){return c.charCodeAt(0)-1776}).replace(/[\u064B-\u0652\u0640]/g,'').replace(/\s+/g,' ').trim();
  if(v.replace(/[\u0621-\u064Aa-zA-Z\d \-]/g,'')!=='')return '';
  var L=(v.match(/[\u0621-\u064Aa-zA-Z]/g)||[]).length,D=(v.match(/\d/g)||[]).length;
  return(L>=1&&L<=3&&D>=2&&D<=4)?v:'';
}
function cleanPhone(v){
  v=String(v).replace(/[٠-٩]/g,function(c){return c.charCodeAt(0)-1632}).replace(/[۰-۹]/g,function(c){return c.charCodeAt(0)-1776});
  var d=v.replace(/\D/g,'');
  if(d.indexOf('0020')===0)d=d.slice(2);
  if(d.indexOf('20')===0&&d.length>=12)d='0'+d.slice(2);
  else if(d.length===10&&d.charAt(0)==='1')d='0'+d;
  return d;
}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}

var sv=$('services');
SERVICES.forEach(function(s){
  var l=el('label','opt');var r=document.createElement('input');
  r.type='radio';r.name='svc';r.value=s;
  r.addEventListener('change',function(){service=s});
  l.appendChild(r);l.appendChild(document.createTextNode(s));sv.appendChild(l);
});

var pb=$('pays');
PAYS.forEach(function(s){
  var l=el('label','opt');var r=document.createElement('input');
  r.type='radio';r.name='pay';r.value=s;
  r.addEventListener('change',function(){pay=s});
  l.appendChild(r);l.appendChild(document.createTextNode(s));pb.appendChild(l);
});

function msgFor(f,n){
  return 'طلب دور جديد - Kayan Car Wash\n'+(n?'رقم الدور: '+n+'\n':'')+
    'الخدمة: '+f.service+'\nطريقة الدفع: '+f.pay+'\nالاسم: '+f.name+'\nالموبايل: '+f.phone+
    (f.car?'\nالعربية: '+f.car:'')+(f.plate?'\nرقم العربية: '+f.plate:'')+(f.notes?'\nملاحظات: '+f.notes:'');
}
function waLink(m){return 'https://wa.me/'+WA+'?text='+encodeURIComponent(m)}

function render(n,ahead,f,state){
  var d=$('done');d.textContent='';
  d.appendChild(el('span','','رقم دورك'));
  d.appendChild(el('b','',String(n)));
  var msg=null;
  if(state==='جاهزة')msg='🎉 عربيتك خلصت وجاهزة! تعالى استلمها.';
  else if(state==='تم')msg='✅ تم تسليم العربية. شكرًا لثقتك في كيان.';
  else if(state==='بتتغسل')msg='🚿 عربيتك بتتغسل دلوقتي.';
  else if(state==='لاغي')msg='❌ الدور ده اتلغى. لو لسه عاوز الخدمة، اطلب رقم جديد.';
  else if(ahead===0)msg='🔔 دورك دلوقتي! تعالى المغسلة.';
  else if(ahead===1)msg='⏰ قدامك عربية واحدة بس، جهّز نفسك وفضّي العربية من متعلقاتك.';
  if(!state)d.appendChild(el('span','',ahead===0?'مفيش حد قدامك.':'قدامك '+ahead+' عربية.'));
  if(msg)d.appendChild(el('p','alertbox',msg));
  var w=el('div','warn');w.appendChild(el('p','','تعليمات مهمة'));
  var ul=document.createElement('ul');
  ['فضّي العربية من أي متعلقات شخصية قبل دورك.','لو وصل دورك ومكنتش موجود خلال 5 دقايق، الحجز بيعتبر لاغي.','الإدارة غير مسؤولة عن فقدان أي متعلقات شخصية.'].forEach(function(t){ul.appendChild(el('li','',t))});
  w.appendChild(ul);d.appendChild(w);
  var a=el('a','btn','ابعت بياناتك على واتساب');
  a.href=waLink(msgFor(f,n));a.target='_blank';a.rel='noopener';d.appendChild(a);
  var r=el('button','btn2','حدّث دوري');r.type='button';
  r.addEventListener('click',function(){
    r.disabled=true;
    fetch(API+'?action=status&n='+n).then(function(x){return x.json()}).then(function(j){show(n,j.ahead,f,j.state)})
    .catch(function(){r.disabled=false;r.textContent='مقدرتش أحدّث، جرّب تاني'});
  });
  d.appendChild(r);
  var nb=el('button','btn2','طلب جديد لعربية تانية');nb.type='button';
  nb.addEventListener('click',function(){
    try{localStorage.removeItem('kayanQ')}catch(e){}
    $('done').style.display='none';$('formArea').style.display='block';
    var sb=$('send');sb.disabled=false;sb.textContent='خدلي رقم دور';window.scrollTo(0,0);
  });
  d.appendChild(nb);
  var ab=el('div','about');ab.appendChild(el('h3','','عن مركز كيان للإطارات والبطاريات'));
  ab.appendChild(el('p','','بنقدملك تغيير زيت، وخدمات الإطارات والترصيص، وبيع الإطارات والبطاريات.'));
  d.appendChild(ab);
  d.style.display='block';$('formArea').style.display='none';
}

var pollT=null,lastKey=null,audioCtx=null;
function unlockAudio(){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}catch(e){}}
function beep(){try{if(!audioCtx)return;var o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.frequency.value=880;g.gain.value=0.2;o.start();o.stop(audioCtx.currentTime+0.4)}catch(e){}}
function alertUser(j){
  try{if(navigator.vibrate)navigator.vibrate([300,150,300,150,300])}catch(e){}
  beep();
  var t=document.title;
  document.title=j.state==='جاهزة'?'🎉 عربيتك جاهزة':j.state==='بتتغسل'?'🚿 بتتغسل':j.state==='تم'?'✅ تم':j.ahead===0?'🔔 دورك دلوقتي':'⏰ قدامك عربية';
  setTimeout(function(){document.title=t},8000);
}
function startPoll(n,f){
  if(pollT)clearInterval(pollT);
  pollT=setInterval(function(){
    fetch(API+'?action=status&n='+n).then(function(x){return x.json()}).then(function(j){
      var key=j.ahead+'|'+(j.state||'');
      if(key!==lastKey){
        lastKey=key;
        if(j.state==='جاهزة'||j.state==='بتتغسل'||j.state==='تم'||j.state==='لاغي'||(!j.state&&(j.ahead===1||j.ahead===0)))alertUser(j);
        render(n,j.ahead,f,j.state);
      }
      if(j.state==='تم'||j.state==='لاغي')clearInterval(pollT);
    }).catch(function(){});
  },30000);
}
function show(n,ahead,f,state){lastKey=ahead+'|'+(state||'');render(n,ahead,f,state);if(state!=='تم'&&state!=='لاغي')startPoll(n,f)}

try{
  var saved=JSON.parse(localStorage.getItem('kayanQ')||'null');
  if(saved&&saved.d===todayStr()){
    fetch(API+'?action=status&n='+saved.n).then(function(x){return x.json()}).then(function(j){show(saved.n,j.ahead,saved.f,j.state)}).catch(function(){});
  }
}catch(e){}

$('send').addEventListener('click',function(){
  unlockAudio();
  var f={service:service,pay:pay,name:$('name').value.trim(),phone:cleanPhone($('phone').value),
    car:$('car').value.trim(),plate:$('plate').value.trim(),notes:$('notes').value.trim()};
  var err=$('err');
  if(!f.service)return err.textContent='اختار الخدمة.';
  if(!f.pay)return err.textContent='اختار طريقة الدفع.';
  if(!f.name)return err.textContent='اكتب اسمك.';
  if(f.phone.replace(/\D/g,'').length<10)return err.textContent='اكتب رقم موبايل صحيح.';
  var pn=normPlate(f.plate);
  if(!pn)return err.textContent='اكتب رقم العربية بشكل صحيح، مثال: أ ب ج 1234';
  f.plate=pn;
  err.textContent='';
  if(sending)return;sending=true;
  var b=$('send');b.disabled=true;b.textContent='ثواني...';
  var q='?action=join&service='+encodeURIComponent(f.service)+'&name='+encodeURIComponent(f.name)+
    '&phone='+encodeURIComponent(f.phone)+'&car='+encodeURIComponent(f.car)+
    '&plate='+encodeURIComponent(f.plate)+'&rid='+rid+'&notes='+encodeURIComponent('الدفع: '+f.pay+(f.notes?' | '+f.notes:''));
  fetch(API+q).then(function(x){return x.json()}).then(function(j){
    try{localStorage.setItem('kayanQ',JSON.stringify({d:todayStr(),n:j.n,f:f}))}catch(e){}
    sending=false;rid=newRid();
    show(j.n,j.ahead,f);
  }).catch(function(){
    sending=false;
    b.disabled=false;b.textContent='خدلي رقم دور';
    err.textContent='حصلت مشكلة في أخد الرقم. ابعت بياناتك على واتساب وهنرد عليك.';
    var a=el('a','btn','ابعت على واتساب');a.href=waLink(msgFor(f,null));a.target='_blank';a.rel='noopener';
    $('formArea').appendChild(a);
  });
});
</script>
