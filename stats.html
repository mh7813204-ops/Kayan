<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Kayan – الإحصائيات</title>
<style>
:root{--bg:#000;--card:#131313;--ink:#fff;--muted:#A9A9A9;--line:#2F2F2F;--or:#F28B2B;--gr:#3C9D5A;--rd:#C0504A;--bl:#3C8DC9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',Tahoma,Arial,sans-serif;line-height:1.6}
main{max-width:860px;margin:0 auto;padding:0 12px 60px}
header{display:flex;align-items:center;gap:10px;padding:10px 0}
.logo{width:52px;height:52px;border-radius:12px}
h1{font-size:1.15rem;margin:0;flex:1}h1 span{color:var(--or)}
.sm{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:6px 12px;font:inherit;cursor:pointer;text-decoration:none;font-size:.9rem}
input{width:100%;max-width:320px;padding:12px;border-radius:10px;border:1.5px solid var(--line);background:#0b0b0b;color:var(--ink);font:inherit;text-align:center;font-size:1.1rem}
#login{margin-top:28px;text-align:center}
.go{margin-top:12px;border:0;border-radius:12px;background:var(--or);color:#000;font:inherit;font-weight:800;padding:12px 28px;cursor:pointer}
.msg{min-height:1.6em;font-weight:600;margin:8px 0;color:#FF8A7A}
.warn{background:#3b2a00;border:1px solid #E0B93A;color:#FFD97A;border-radius:12px;padding:10px;margin:8px 0;font-weight:600}
.tabs{display:flex;gap:8px;margin:6px 0 12px}
.tab{flex:1;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:8px 4px;font:inherit;font-weight:600;cursor:pointer}
.tab[aria-pressed="true"]{border-color:var(--or);background:#2A1808}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
@media(min-width:600px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.kpi b{display:block;font-size:1.7rem;color:var(--or);line-height:1.2}
.kpi span{font-size:.8rem;color:var(--muted)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.panel h2{font-size:1rem;margin:0 0 10px}
.insight{background:#2A1808;border:1px solid var(--or);border-radius:12px;padding:10px;margin-bottom:12px;line-height:1.9}
.hb{display:grid;grid-template-columns:minmax(80px,38%) 1fr auto;gap:8px;align-items:center;margin-bottom:6px;font-size:.9rem}
.hb .t{height:14px;background:#262626;border-radius:7px;overflow:hidden}
.hb .t i{display:block;height:100%;background:var(--or);border-radius:7px}
.hb .l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .v{color:var(--muted);font-variant-numeric:tabular-nums}
.vbars{display:flex;align-items:flex-end;gap:3px;height:150px;direction:ltr;overflow-x:auto;padding-bottom:2px}
.vb{flex:1;min-width:14px;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;height:100%;text-align:center}
.vb .col{display:flex;flex-direction:column-reverse;border-radius:4px 4px 0 0;overflow:hidden}
.vb .s1{background:var(--gr)}.vb .s2{background:var(--or)}.vb .s3{background:var(--rd)}
.vb small{font-size:.65rem;color:var(--muted);direction:ltr;white-space:nowrap;overflow:visible}
.vb .n{font-size:.7rem;color:var(--ink)}
.legend{display:flex;gap:12px;font-size:.8rem;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:4px}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:center}
th{color:var(--muted);font-weight:600}
#stamp{text-align:center;color:var(--muted);font-size:.8rem}
.empty{color:var(--muted);text-align:center;padding:12px}
</style>
</head>
